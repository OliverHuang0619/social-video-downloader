services:
  app:
    build:
      context: .
      target: runtime
    image: social-video-workbench:latest
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:3000"
    environment:
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      SESSION_SECRET_FILE: /run/secrets/session_secret
      SVD_SECURE_COOKIE: "${SVD_SECURE_COOKIE:-false}"
      SVD_BROWSER_MODE: "${SVD_BROWSER_MODE:-container}"
      SVD_BROWSER_CDP: "${SVD_BROWSER_CDP:-http://browser:9222}"
      SVD_BROWSER_TOKEN_FILE: /config/local-browser.token
      SVD_CODEX_MODEL: "${SVD_CODEX_MODEL:-gpt-5.6-sol}"
      SVD_CODEX_REASONING_EFFORT: "${SVD_CODEX_REASONING_EFFORT:-medium}"
      TZ: "${TZ:-Asia/Shanghai}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    secrets:
      - admin_password
      - session_secret
    volumes:
      - ./downloads:/downloads
      - ./imports:/imports:ro
      - ./config:/config
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  browser:
    build:
      context: .
      dockerfile: Dockerfile.browser
    image: social-video-workbench-browser:latest
    restart: unless-stopped
    shm_size: 2gb
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
    volumes:
      - ./downloads:/downloads:ro
      - ./imports:/imports:ro
      - ./config/douyin-profile:/browser-profile
    expose:
      - "6080"
      - "9222"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9222/json/version >/dev/null && curl -fsS http://127.0.0.1:6080/vnc.html >/dev/null"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

secrets:
  admin_password:
    file: ./config/admin_password
  session_secret:
    file: ./config/session_secret
